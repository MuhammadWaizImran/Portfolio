<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Build / Ship / Scale — Interactive Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#000;--fg:#fff;--pad-x:clamp(20px,6.95vw,120px)}
    *{box-sizing:border-box}html,body{height:100%;margin:0;background:#000;color:#fff;font-family:'Poppins',sans-serif;-webkit-font-smoothing:antialiased}body{overflow-x:hidden}
    .hero{position:relative;width:100%;height:100vh;height:100svh;min-height:520px;overflow:hidden;background:#000}
    #scene{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}#scene.dragging{cursor:grabbing}
    .ui{position:absolute;inset:0;pointer-events:none;z-index:2}.ui a,.ui button{pointer-events:auto}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
    .nav{position:absolute;top:clamp(24px,4.7vh,40px);left:var(--pad-x);right:var(--pad-x);display:flex;align-items:center;justify-content:space-between}
    .logo{display:flex;align-items:center;gap:8px;color:#fff;text-decoration:none;font-size:15px;letter-spacing:-.01em}.logo-mark{width:20px;height:40px;background:#fff;border-radius:0 20px 20px 0}.logo b{font-weight:700}.logo span{font-weight:400}
    .nav-links{display:flex;gap:clamp(20px,4.1vw,60px);list-style:none;margin:0;padding:0}.nav-links a{color:#fff;text-decoration:none;font-size:15px;font-weight:500;position:relative}.nav-links a::after{content:'';position:absolute;left:0;right:0;bottom:-4px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:right;transition:transform .35s ease}.nav-links a:hover::after,.nav-links a:focus-visible::after{transform:scaleX(1);transform-origin:left}
    .arrows{position:absolute;top:18.9%;left:76.7%;display:flex;gap:32px;transform:translate(-19px,-50%)}.arrow{width:38px;height:38px;border-radius:50%;border:2.5px solid #fff;background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer;transition:background .25s,color .25s}.arrow svg{width:18px;height:18px}.arrow:hover,.arrow:focus-visible{background:#fff;color:#000}
    .dots{position:absolute;right:calc(var(--pad-x) - 7px);top:49.4%;transform:translateY(-50%);display:flex;flex-direction:column;gap:33px}.dot{width:14px;height:14px;border-radius:50%;border:2px solid #fff;background:#fff;cursor:pointer;transition:background .25s}.dot.active{background:transparent}
    .tagline{position:absolute;left:var(--pad-x);bottom:clamp(40px,7.5vh,70px);margin:0;font-size:clamp(24px,2.65vw,44px);line-height:1.2;font-weight:300;letter-spacing:-.01em}.tagline strong{font-weight:700;display:block}
    .cta-row{position:absolute;left:45.6%;right:-1vw;top:88.7%;transform:translateY(-50%);display:flex;align-items:center}.cta{flex:none;padding:0 15px;height:48px;display:inline-flex;align-items:center;border:1.5px solid rgba(255,255,255,.85);border-radius:6px;background:rgba(0,0,0,.15);color:#fff;font-size:14px;font-weight:400;text-decoration:none;cursor:pointer;transition:background .25s,color .25s}.cta:hover,.cta:focus-visible{background:#fff;color:#000}.cta-line{flex:1;height:1.5px;background:rgba(255,255,255,.8);min-width:40px}.count{flex:none;font-size:clamp(140px,19.8vw,360px);font-weight:400;line-height:1;letter-spacing:-.02em;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.9);transform:translateY(6%);user-select:none}
    .loader{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:12px;letter-spacing:.2em;text-transform:uppercase;opacity:.6;transition:opacity .6s}.loader.done{opacity:0}
    @media(max-width:900px),(max-aspect-ratio:1/1){.arrows{left:auto;right:var(--pad-x);top:15%;transform:translateY(-50%);gap:14px}.tagline{bottom:clamp(150px,20vh,220px)}.cta-row{left:var(--pad-x);right:-3vw;top:auto;bottom:24px;transform:none}.count{font-size:clamp(120px,22vw,200px)}}
    @media(max-width:640px){.nav-links{gap:16px}.nav-links a,.logo{font-size:13px}.dots{gap:20px;right:16px}.dot{width:10px;height:10px}.cta-row{right:-8vw}.count{font-size:120px}}
    @media(max-width:420px){.nav-links li:nth-child(2){display:none}}
    .nav,.dots,.tagline,.cta-row{display:none}.arrows{top:auto;bottom:35px;left:auto;right:6vw;transform:none;gap:12px}.arrow{border-width:1px;width:42px;height:42px;background:rgba(0,0,0,.3)}
    @media(max-width:1000px){#scene{touch-action:pan-y}.arrow{width:44px;height:44px}.arrows{bottom:max(24px,env(safe-area-inset-bottom));right:22px}}
  </style>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
</head>
<body>
  <section class="hero" id="hero">
    <canvas id="scene" aria-label="Rotatable glass cube. Drag to rotate."></canvas>
    <div class="ui">
      <h1 class="sr-only">Build Ship Scale</h1>
      <header class="nav">
        <a href="#hero" class="logo" aria-label="Design World home"><i class="logo-mark" aria-hidden="true"></i><b>Design</b><span>World</span></a>
        <ul class="nav-links"><li><a href="#hero">Home</a></li><li><a href="#hero">Portfolio</a></li><li><a href="#hero">Contact Us</a></li></ul>
      </header>
      <div class="arrows">
        <button class="arrow" id="prev" aria-label="Rotate cube left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
        <button class="arrow" id="next" aria-label="Rotate cube right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </div>
      <nav class="dots" aria-label="Slide position"><button class="dot" aria-label="Slide 1"></button><button class="dot active" aria-label="Slide 2" aria-current="true"></button><button class="dot" aria-label="Slide 3"></button></nav>
      <p class="tagline">Let's Build the<br>Future of <strong>Design.</strong></p>
      <div class="cta-row"><a href="#hero" class="cta">Explore Now</a><span class="cta-line"></span><span class="count" aria-hidden="true">07</span></div>
      <div class="loader" id="loader" role="status">Loading model</div>
    </div>
  </section>
  <script type="module">
    import * as THREE from 'three';
    import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
    import {mergeVertices,mergeGeometries} from 'three/addons/utils/BufferGeometryUtils.js';
    import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';

    const MODEL_URL='https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260929_212926_92423081-b0e4-4f5a-b650-14af6c05c058.glb';
    const canvas=document.querySelector('#scene'),loader=document.querySelector('#loader');
    const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});
    renderer.setClearColor(0x000000);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.autoClear=false;
    const camera=new THREE.PerspectiveCamera(30,1,.1,100);camera.position.set(0,0,10);camera.lookAt(0,0,0);
    const scene=new THREE.Scene(),bgScene=new THREE.Scene(),bgCamera=new THREE.Camera();
    const pivot=new THREE.Group(),spinner=new THREE.Group();scene.add(pivot);pivot.add(spinner);spinner.rotation.set(-.42,.62,.18);
    const headlineCanvas=document.createElement('canvas'),ctx=headlineCanvas.getContext('2d');
    const headlineTexture=new THREE.CanvasTexture(headlineCanvas);headlineTexture.colorSpace=THREE.SRGBColorSpace;headlineTexture.minFilter=THREE.LinearFilter;headlineTexture.magFilter=THREE.LinearFilter;headlineTexture.generateMipmaps=false;
    const bgMaterial=new THREE.ShaderMaterial({uniforms:{uTex:{value:headlineTexture}},vertexShader:'varying vec2 vUv; void main(){vUv=uv;gl_Position=vec4(position.xy,0.0,1.0);}',fragmentShader:'uniform sampler2D uTex;varying vec2 vUv;void main(){gl_FragColor=texture2D(uTex,vUv);\n#include <colorspace_fragment>\n}',depthTest:false,depthWrite:false});
    const bgQuad=new THREE.Mesh(new THREE.PlaneGeometry(2,2),bgMaterial);bgQuad.frustumCulled=false;bgScene.add(bgQuad);
    const glassVertex=`varying vec3 vNormal;varying vec3 vEye;void main(){vec4 worldPos=modelMatrix*vec4(position,1.0);vec4 mvPos=viewMatrix*worldPos;gl_Position=projectionMatrix*mvPos;vNormal=normalize(normalMatrix*normal);vEye=normalize(mvPos.xyz);}`;
    const glassFragment=`uniform sampler2D uTexture;uniform vec2 uResolution;uniform float uIorR,uIorY,uIorG,uIorC,uIorB,uIorP;uniform float uRefractPower,uChromatic,uSaturation,uShininess,uDiffuseness,uFresnelPower,uBackside;uniform vec3 uLight;varying vec3 vNormal;varying vec3 vEye;
      float specularLight(vec3 n,vec3 e,vec3 l,float shine,float diffuse){vec3 h=normalize(l-e);return pow(max(dot(n,h),0.0),shine)+max(0.0,dot(n,l))*diffuse;}
      void main(){vec2 uv=gl_FragCoord.xy/uResolution;vec3 n=normalize(vNormal);if(uBackside>0.5)n=-n;vec3 eye=normalize(vEye);vec3 color=vec3(0.0);
        for(int i=0;i<16;i++){float slide=float(i)/16.0*0.045;
          vec3 rr=texture2D(uTexture,uv+refract(eye,n,1.0/uIorR).xy*(uRefractPower+slide)*uChromatic).rgb;
          vec3 yy=texture2D(uTexture,uv+refract(eye,n,1.0/uIorY).xy*(uRefractPower+slide)*uChromatic).rgb;
          vec3 gg=texture2D(uTexture,uv+refract(eye,n,1.0/uIorG).xy*(uRefractPower+slide*2.0)*uChromatic).rgb;
          vec3 cc=texture2D(uTexture,uv+refract(eye,n,1.0/uIorC).xy*(uRefractPower+slide*2.5)*uChromatic).rgb;
          vec3 bb=texture2D(uTexture,uv+refract(eye,n,1.0/uIorB).xy*(uRefractPower+slide*3.0)*uChromatic).rgb;
          vec3 pp=texture2D(uTexture,uv+refract(eye,n,1.0/uIorP).xy*(uRefractPower+slide)*uChromatic).rgb;
          float r=rr.r*.5,y=(yy.r*2.0+yy.g*2.0-yy.b)/6.0,g=gg.g*.5,c=(cc.g*2.0+cc.b*2.0-cc.r)/6.0,b=bb.b*.5,p=(pp.b*2.0+pp.r*2.0-pp.g)/6.0;
          color+=vec3(r+(2.0*p+2.0*y-c)/3.0,g+(2.0*y+2.0*c-p)/3.0,b+(2.0*c+2.0*p-y)/3.0);
        }color/=16.0;float luma=dot(color,vec3(.2125,.7154,.0721));color=mix(vec3(luma),color,uSaturation);
        vec3 light=normalize(-uLight);float spec=specularLight(n,eye,light,uShininess,uDiffuseness)+.6*specularLight(n,eye,normalize(vec3(1.0,1.0,-1.0)),uShininess*.6,uDiffuseness*.5);color+=vec3(spec)*(uBackside>.5?.35:1.0);
        float fresnel=pow(1.0+dot(eye,n),uFresnelPower);color=mix(color,vec3(1.0),clamp(fresnel*(uBackside>.5?.25:.55),0.0,1.0));color+=vec3(.004,.005,.007);gl_FragColor=vec4(color,1.0);
        #include <colorspace_fragment>
      }`;
    const uniforms=(back)=>({uTexture:{value:null},uResolution:{value:new THREE.Vector2(1,1)},uIorR:{value:1.15},uIorY:{value:1.16},uIorG:{value:1.18},uIorC:{value:1.22},uIorB:{value:1.22},uIorP:{value:1.22},uRefractPower:{value:back?.22:.30},uChromatic:{value:.5},uSaturation:{value:1.08},uShininess:{value:90},uDiffuseness:{value:.02},uFresnelPower:{value:5},uLight:{value:new THREE.Vector3(-1,1,1)},uBackside:{value:back?1:0}});
    const backMat=new THREE.ShaderMaterial({uniforms:uniforms(true),vertexShader:glassVertex,fragmentShader:glassFragment,side:THREE.BackSide,depthTest:true,depthWrite:true});
    const frontMat=new THREE.ShaderMaterial({uniforms:uniforms(false),vertexShader:glassVertex,fragmentShader:glassFragment,side:THREE.FrontSide,depthTest:true,depthWrite:true});
    const rtBack=new THREE.WebGLRenderTarget(1,1,{type:THREE.HalfFloatType}),rtFront=new THREE.WebGLRenderTarget(1,1,{type:THREE.HalfFloatType});
    backMat.uniforms.uTexture.value=rtBack.texture;frontMat.uniforms.uTexture.value=rtFront.texture;
    let cube,backCube,W=0,H=0,mobile=false,backgroundDirty=true;
    function installGeometry(geometry){geometry.computeBoundingBox();const box=geometry.boundingBox,centre=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3());geometry.translate(-centre.x,-centre.y,-centre.z);geometry.scale(1/Math.max(size.x,size.y,size.z),1/Math.max(size.x,size.y,size.z),1/Math.max(size.x,size.y,size.z));
      if(cube){spinner.remove(cube);spinner.remove(backCube);cube.geometry.dispose();}cube=new THREE.Mesh(geometry,frontMat);backCube=new THREE.Mesh(geometry,backMat);spinner.add(cube,backCube);layout();loader.classList.add('done');}
    function redrawHeadline(){const dpr=Math.min(devicePixelRatio,2);headlineCanvas.width=Math.round(W*dpr);headlineCanvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);let fs=Math.min(H*.21,W*(mobile?.21:.118));ctx.font=`800 ${fs}px Poppins`;const max=Math.max(...['BUILD','SHIP','SCALE'].map(s=>ctx.measureText(s).width));if(max>W*(mobile?.9:.5))fs*=W*(mobile?.9:.5)/max;ctx.font=`800 ${fs}px Poppins`;ctx.fillStyle='#e9e9e9';ctx.textAlign='center';ctx.textBaseline='alphabetic';const cx=W*(mobile?.5:.54),cy=H*(mobile?.47:.53),gap=fs*1.07,cap=fs*.7;['BUILD','SHIP','SCALE'].forEach((line,i)=>ctx.fillText(line,cx,cy+cap/2+(i-1)*gap));headlineTexture.needsUpdate=true;backgroundDirty=true;}
    function layout(){W=canvas.clientWidth;H=canvas.clientHeight;if(!W||!H)return;mobile=W<768||W/H<1;renderer.setSize(W,H,false);camera.aspect=W/H;camera.updateProjectionMatrix();const dpr=renderer.getPixelRatio(),dw=Math.round(W*dpr),dh=Math.round(H*dpr);rtBack.setSize(dw,dh);rtFront.setSize(dw,dh);backMat.uniforms.uResolution.value.set(dw,dh);frontMat.uniforms.uResolution.value.set(dw,dh);const visH=2*Math.tan(THREE.MathUtils.degToRad(15))*10,visW=visH*W/H,sx=mobile?.5:.517,sy=mobile?.45:.488;const edge=Math.min(H*.44,W*(mobile?.45:.29));pivot.position.set((sx-.5)*visW,(.5-sy)*visH,0);pivot.scale.setScalar(edge/H*visH);redrawHeadline();}
    function loadModel(){new GLTFLoader().load(MODEL_URL,gltf=>{try{gltf.scene.updateMatrixWorld(true);const parts=[];gltf.scene.traverse(mesh=>{if(!mesh.isMesh)return;let g=mesh.geometry.clone();for(const a of Object.keys(g.attributes))if(a!=='position'&&a!=='normal')g.deleteAttribute(a);g=mergeVertices(g,1e-4);g.computeVertexNormals();g.applyMatrix4(mesh.matrixWorld);parts.push(g);});if(!parts.length)throw Error('No mesh');const merged=mergeGeometries(parts);if(!merged)throw Error('Geometry merge failed');installGeometry(merged);}catch(err){console.warn('Using rounded cube fallback',err);installGeometry(new RoundedBoxGeometry(1,1,1,8,.12));}},undefined,()=>installGeometry(new RoundedBoxGeometry(1,1,1,8,.12)));}
    const axisY=new THREE.Vector3(0,1,0),axisX=new THREE.Vector3(1,0,0),qY=new THREE.Quaternion(),qX=new THREE.Quaternion();const turn=(dx,dy)=>{spinner.quaternion.premultiply(qY.setFromAxisAngle(axisY,dx));spinner.quaternion.premultiply(qX.setFromAxisAngle(axisX,dy));};
    let dragging=false,lastX=0,lastY=0,lastMove=performance.now(),release=performance.now()-2000,vx=0,vy=0,remaining=0,prev=performance.now();
    canvas.addEventListener('pointerdown',e=>{dragging=true;remaining=0;vx=vy=0;lastX=e.clientX;lastY=e.clientY;lastMove=performance.now();canvas.setPointerCapture(e.pointerId);canvas.classList.add('dragging');});
    canvas.addEventListener('pointermove',e=>{if(!dragging)return;const now=performance.now(),dx=(e.clientX-lastX)*.008,dy=(e.clientY-lastY)*.008;turn(dx,dy);const frames=Math.max((now-lastMove)/16.67,.5);vx=dx/frames;vy=dy/frames;lastX=e.clientX;lastY=e.clientY;lastMove=now;});
    const endDrag=()=>{dragging=false;release=performance.now();canvas.classList.remove('dragging');};canvas.addEventListener('pointerup',endDrag);canvas.addEventListener('pointercancel',endDrag);
    document.querySelector('#prev').addEventListener('click',()=>{remaining-=Math.PI/2;vx=vy=0;});document.querySelector('#next').addEventListener('click',()=>{remaining+=Math.PI/2;vx=vy=0;});
    document.querySelectorAll('.dot').forEach(dot=>dot.addEventListener('click',()=>{document.querySelectorAll('.dot').forEach(d=>{d.classList.remove('active');d.removeAttribute('aria-current');});dot.classList.add('active');dot.setAttribute('aria-current','true');}));
    function frame(now){frameId=0;if(!renderActive())return;frameId=requestAnimationFrame(frame);const dt=Math.min((now-prev)/1000,.05);prev=now;const frames=dt*60;if(!dragging){if(Math.abs(remaining)>.0005){const step=remaining*Math.min(1,.09*frames);turn(step,0);remaining-=step;}else{remaining=0;turn(vx*frames,vy*frames);const damp=Math.pow(.94,frames);vx*=damp;vy*=damp;}const blend=Math.min(1,Math.max(0,(now-release-600)/1000));turn(.0035*frames*blend,.0012*frames*blend);}
      if(backgroundDirty){renderer.setRenderTarget(rtBack);renderer.clear();renderer.render(bgScene,bgCamera);backgroundDirty=false;}
      renderer.setRenderTarget(rtFront);renderer.clear();renderer.render(bgScene,bgCamera);if(backCube){backCube.visible=true;cube.visible=false;renderer.clearDepth();renderer.render(scene,camera);}
      renderer.setRenderTarget(null);renderer.clear();renderer.render(bgScene,bgCamera);if(cube){backCube.visible=false;cube.visible=true;renderer.clearDepth();renderer.render(scene,camera);}
    }
    // The parent reports iframe intersection; document visibility alone cannot detect it.
    let frameId=0,ready=false,parentVisible=window.parent===window;
    const renderActive=()=>ready&&parentVisible&&!document.hidden;
    const syncRendering=()=>{
      cancelAnimationFrame(frameId);frameId=0;
      if(renderActive()){prev=performance.now();frameId=requestAnimationFrame(frame);}
    };
    addEventListener('message',event=>{
      if(event.source!==window.parent||event.origin!==location.origin||event.data?.type!=='portfolio-visibility')return;
      parentVisible=event.data.visible===true;syncRendering();
    });
    document.addEventListener('visibilitychange',syncRendering);
    // Same-origin fallback also handles a cached parent load before this listener exists.
    if(window.parent!==window&&window.frameElement){
      new window.parent.IntersectionObserver(([entry])=>{parentVisible=entry.isIntersecting;syncRendering();}).observe(window.frameElement);
    }
    window.addEventListener('resize',layout);document.fonts.addEventListener('loadingdone',redrawHeadline);
    await Promise.race([Promise.all([document.fonts.load('800 100px Poppins'),document.fonts.ready]),new Promise(resolve=>setTimeout(resolve,2500))]);layout();loadModel();ready=true;syncRendering();
  </script>
